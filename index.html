  .ios b { color:#7C2D12; }

<script>
/* DENTALY COMO APP. Este archivo "abre" el sistema de Apps Script en
   pantalla completa y en su propia ventana. El PIN se queda solo en ESTE teléfono.
   ⚡ (2026-11-05) También guarda EN ESTE TELÉFONO una copia de las pantallas que se abren
   (inicio, agenda, fichas del día, material) para que abran al instante y se puedan ver
   sin internet. Lo de Material que se registre sin internet se manda al regresar la señal. */
var SISTEMA = 'https://script.google.com/macros/s/AKfycbwExKBacg6rF_7T1fQddk8YhgOCHolOXoD2JGw13KIHwdKGHHvWK9pzbGlMj1mmb9Wchw/exec';
var K_PIN = 'dentaly_app_pin', K_INICIO = 'dentaly_app_inicio';
function lsG(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }
function lsS(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

/* Ligas directas: https://dentaly.github.io/dentaly/?caja=DX-065 (o ?id=,
   ?orden=, ?fecha=...) abren ESA pantalla dentro de la app. En Android, si la
   app está instalada, el teléfono abre estas ligas en la app y no en Chrome. */
var HREF0 = location.href;   // la liga con la que se abrió (antes de limpiarla)
/* 🛡 (2026-11-05) ¿Es una visita NUEVA (se escaneó el QR) o la página se volvió a cargar sola?
   Recargar, regresar, una pestaña que el navegador restaura o una sugerencia que Chrome
   "precarga" al tocar la barra de direcciones NO son un escaneo: el material se abre solo
   para verlo (ver=1) y no se descuenta nada. */
function visitaNueva(){
  try { if (document.prerendering || VINO_DE_PRECARGA) return false; } catch(e){}
  try { var n = performance.getEntriesByType('navigation')[0]; if (n && n.type && n.type !== 'navigate') return false; } catch(e){}
  try { if (performance.navigation && performance.navigation.type !== 0) return false; } catch(e){}
  return true;
}
var VINO_DE_PRECARGA = false;
try { if (document.prerendering) VINO_DE_PRECARGA = true; } catch(e){}
function destinoDeLiga(){
  var q = (location.search || '').replace(/^\?/, '');
  if (!q) return '';
  var partes = q.split('&').filter(function(kv){
    var k = kv.split('=')[0];
    return k && k !== 'config' && k !== 'pin';
  });
  var esMaterial = partes.some(function(kv){ return kv.split('=')[0] === 'inv'; });
  if (esMaterial && !visitaNueva() && partes.indexOf('ver=1') === -1) partes.push('ver=1');
  return partes.join('&');
}
/* La dirección se limpia después de abrir: así, si la pestaña se recarga o la liga queda en el
   historial del navegador, ya no trae el material (?inv=…) y no puede volver a registrar una salida. */
function limpiarDireccion(){
  try { if (location.search && location.search.indexOf('config') === -1) history.replaceState(null, '', location.pathname); } catch(e){}
}

/* REGRESAR DONDE ESTABA (2026-10-28): el sistema avisa en qué pantalla va
   (ficha, agenda, menú…). Si el teléfono cerró la app para ahorrar memoria,
   al abrirla de nuevo regresa ahí mismo (si fue en las últimas 8 horas).
   La agenda siempre abre en HOY. */
var K_ULT = 'dentaly_app_ultimo', K_FEC = 'dentaly_app_dia';
window.addEventListener('message', function(e){
  var d = e && e.data;
  if (!d || !d.dentalyPos || typeof d.dentalyPos !== 'object') return;
  var p = {}, src = d.dentalyPos;
  Object.keys(src).forEach(function(k){ if (['pin', 'accion', 'pac', 'fecha', 'mi'].indexOf(k) === -1) p[k] = String(src[k]); });
  lsS(K_ULT, JSON.stringify({ p: p, t: Date.now() }));
  // Día que se está viendo en la agenda: si se RECARGA pronto (30 min), regresa a ese día.
  if (d.dentalyFecha && /^\d{4}-\d{2}-\d{2}$/.test(String(d.dentalyFecha))) lsS(K_FEC, JSON.stringify({ f: String(d.dentalyFecha), t: Date.now() }));
});
/* 🔔 AVISOS DE TAREAS (2026-10-30): la agenda (con el PIN de recepción) manda
   "dentalyAviso" y aquí se convierte en notificación del teléfono o de Windows,
   aunque esté en otra ventana. Primero hay que activarlos con el botón 🔔. */
function botonAvisos(){
  if (!('Notification' in window) || Notification.permission !== 'default' || document.getElementById('btnAvisos')) return;
  // (2026-11-07) Ya no estorba: chiquito abajo a la izquierda, con ✕ para esconderlo 2 semanas.
  // En iPhone solo funciona con la app instalada en inicio: en Safari normal no se muestra.
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent), instalada = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  if (ios && !instalada) return;
  try { var no = Number(lsG('dentaly_avisos_no') || 0); if (no && Date.now() - no < 14 * 864e5) return; } catch(e){}
  var b = document.createElement('div');
  b.id = 'btnAvisos';
  b.style.cssText = 'position:fixed;left:10px;bottom:12px;z-index:99;display:flex;align-items:center;gap:2px;background:#5B21B6;color:#fff;border-radius:999px;font:700 12px Arial,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.25);opacity:.92;';
  b.innerHTML = '<span id="btnAvSi" style="padding:7px 4px 7px 11px;cursor:pointer;">🔔 Avisos</span><span id="btnAvNo" style="padding:7px 10px 7px 6px;cursor:pointer;opacity:.75;">✕</span>';
  document.body.appendChild(b);
  document.getElementById('btnAvSi').onclick = function(){ Notification.requestPermission().then(function(){ b.remove(); }); };
  document.getElementById('btnAvNo').onclick = function(){ lsS('dentaly_avisos_no', String(Date.now())); b.remove(); };
}
function notificar(t){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  var op = { body: t.texto || '', tag: t.tag || 'dentaly', renotify: true, requireInteraction: true, vibrate: [300, 150, 300], icon: 'icon-192.png', badge: 'icon-192.png' };
  if (navigator.serviceWorker && navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(function(r){ r.showNotification(t.titulo || 'Dentaly', op); }).catch(function(){ try { new Notification(t.titulo || 'Dentaly', op); } catch(e){} });
  else { try { new Notification(t.titulo || 'Dentaly', op); } catch(e){} }
}
window.addEventListener('message', function(e){
  var d = e && e.data; if (!d) return;
  if (d.dentalyQuiereAvisos) botonAvisos();
  if (d.dentalyAviso) notificar(d.dentalyAviso);
});
/* 🔔 AVISO "SIGUIENTE PACIENTE" (2026-11-06): para las doctoras. Llega aunque la app esté cerrada (Web Push).
   En iPhone solo funciona con la app instalada en la pantalla de inicio (iOS 16.4 o más nuevo). */
var PUSH_KEY = 'BHO0x8sV9whi0SMCmIejjrKd2m1yjecRh1_wDVGVDjadDmKBxoUm7O3MtY4WzDfZRGutflhDX3iPF-Mf_ghByKE';
function pushListo(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function b64uBytes(t){ t = String(t).replace(/-/g, '+').replace(/_/g, '/'); while (t.length % 4) t += '='; var r = atob(t), u = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) u[i] = r.charCodeAt(i); return u; }
function pushSuscribir(src, conBoton){
  navigator.serviceWorker.ready.then(function(reg){
    return reg.pushManager.getSubscription().then(function(s){ return s || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uBytes(PUSH_KEY) }); });
  }).then(function(sub){ try { src.postMessage({ dentalyPushSub: JSON.parse(JSON.stringify(sub)), nuevo: !!conBoton }, '*'); } catch(e){} })
    .catch(function(er){ if (conBoton) alert('No se pudieron activar los avisos: ' + (er && er.message ? er.message : er)); });
}
function botonPush(src, doctor){
  if (document.getElementById('btnPush')) return;
  var b = document.createElement('button');
  b.id = 'btnPush'; b.textContent = '🔔 Avisarme de mi siguiente paciente';
  b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:99;background:#0B4F4A;color:#fff;border:none;border-radius:999px;padding:13px 18px;font:800 14px Arial,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.3);white-space:nowrap;';
  var x = document.createElement('span'); x.textContent = '  ✕'; x.style.cssText = 'opacity:.7;margin-left:6px;';
  x.onclick = function(ev){ ev.stopPropagation(); b.remove(); lsS('dentaly_push_no', String(Date.now())); };
  b.appendChild(x);
  b.onclick = function(){ Notification.requestPermission().then(function(p){ b.remove(); if (p === 'granted') pushSuscribir(src, true); }); };
  document.body.appendChild(b);
}
window.addEventListener('message', function(e){
  var d = e && e.data; if (!d) return;
  if (d.dentalyQuierePush && pushListo()) {
    if (Notification.permission === 'granted') pushSuscribir(e.source, false);   // ya aceptó: se mantiene al día (sin preguntar)
    else if (Notification.permission === 'default' && Date.now() - Number(lsG('dentaly_push_no') || 0) > 3 * 864e5) botonPush(e.source, d.dentalyQuierePush.doctor);
  }
  if (d.dentalyPushId) {
    try { caches.open('dentaly-cfg').then(function(c){ return c.put('aviso-id', new Response(String(d.dentalyPushId))); }); } catch(er){}
  }
});

/* ═══ ⚡ COPIAS EN EL TELÉFONO (IndexedDB) ═══ */
var DB = null, DB_CB = [];
(function(){ try { var r = indexedDB.open('dentaly', 1); r.onupgradeneeded = function(){ var d = r.result; ['snap', 'resp', 'cola'].forEach(function(n){ if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, n === 'cola' ? { keyPath: 'id', autoIncrement: true } : undefined); }); };
  r.onsuccess = function(){ DB = r.result; DB_CB.splice(0).forEach(function(f){ f(); }); }; r.onerror = function(){ DB_CB.splice(0).forEach(function(f){ f(); }); }; } catch(e){} })();
function conDB(f){ if (DB) f(); else DB_CB.push(f); setTimeout(function(){ var i = DB_CB.indexOf(f); if (i !== -1) { DB_CB.splice(i, 1); f(); } }, 1500); }
function dbGet(st, k, cb){ conDB(function(){ if (!DB) { cb(null); return; } try { var q = DB.transaction(st).objectStore(st).get(k); q.onsuccess = function(){ cb(q.result || null); }; q.onerror = function(){ cb(null); }; } catch(e){ cb(null); } }); }
function dbPut(st, k, v){ conDB(function(){ if (!DB) return; try { var os = DB.transaction(st, 'readwrite').objectStore(st); if (k === null) os.add(v); else os.put(v, k); } catch(e){} }); }
function dbDel(st, k){ conDB(function(){ if (!DB) return; try { DB.transaction(st, 'readwrite').objectStore(st).delete(k); } catch(e){} }); }
function dbTodos(st, cb){ conDB(function(){ if (!DB) { cb([]); return; } try { var q = DB.transaction(st).objectStore(st).getAll(); q.onsuccess = function(){ cb(q.result || []); }; q.onerror = function(){ cb([]); }; } catch(e){ cb([]); } }); }
function paramsDe(q){ var p = {}; String(q || '').replace(/^[?]/, '').split('&').forEach(function(kv){ if (!kv) return; var i = kv.indexOf('='); var k = decodeURIComponent((i === -1 ? kv : kv.slice(0, i)).replace(/[+]/g, ' ')); if (k) p[k] = i === -1 ? '' : decodeURIComponent(kv.slice(i + 1).replace(/[+]/g, ' ')); }); return p; }
// Igual que en el sistema: qué pantalla es cada liga.
function claveDe(p){
  if (p.id) return 'f:' + p.id; if (p.agenda) return 'agenda'; if (p.rxsubir) return 'rx'; if (p.mi) return 'mi:' + p.mi + (p.mes ? ':' + p.mes : '');
  if (p.caja) return 'caja:' + p.caja; if ('inv' in p) return 'inv:' + p.inv; if ('banco' in p) return 'banco'; if ('fact' in p) return 'fact'; if ('pedido' in p) return 'pedido'; if (p.ultimo === 'etiquetas') return 'ultimo'; if ('etiquetas' in p) return 'etiquetas'; if ('inventario' in p) return 'inventario';
  if (p.orden) return 'orden:' + p.orden; if (p.accion || p.pac) return 'home:x'; return 'home';
}
function llaveSnap(k){ return lsG(K_PIN) + '|' + k; }
var K_IDX = 'dentaly_snaps';
function snapIndice(){ try { return JSON.parse(lsG(K_IDX) || '{}'); } catch(e){ return {}; } }
function snapGuardar(k, html, t){
  var idx = snapIndice(), ll = llaveSnap(k); idx[ll] = t || Date.now(); dbPut('snap', ll, { html: html, t: t || Date.now() });
  var ks = Object.keys(idx).sort(function(a, b){ return idx[a] - idx[b]; });
  while (ks.length > 60) { var v = ks.shift(); delete idx[v]; dbDel('snap', v); }   // máximo 60 pantallas guardadas
  lsS(K_IDX, JSON.stringify(idx));
}
var SISTEMA_LISTO = false;
window.addEventListener('message', function(e){
  var d = e && e.data; if (!d) return;
  if (d.dentalySnap && d.dentalySnap.k && d.dentalySnap.html) snapGuardar(d.dentalySnap.k, d.dentalySnap.html, d.dentalySnap.t);
  if (d.dentalySnapPide && e.source) { var q = d.dentalySnapPide; dbGet('snap', llaveSnap(q.k), function(r){ try { e.source.postMessage({ dentalySnapResp: { id: q.id, html: r ? r.html : '', t: r ? r.t : 0 } }, '*'); } catch(er){} }); }
  if (d.dentalyResp && d.dentalyResp.fn) dbPut('resp', lsG(K_PIN) + '|' + d.dentalyResp.fn + '|' + d.dentalyResp.a, { r: d.dentalyResp.r, t: d.dentalyResp.t });
  if (d.dentalyListo && e.source) {
    SISTEMA_LISTO = true; quitarAvisoLento(); quitarPrevia();
    try { e.source.postMessage({ dentalyAppV: 2 }, '*'); } catch(er){}
    dbTodos('cola', function(l){ if (l.length) try { e.source.postMessage({ dentalyCola: l }, '*'); } catch(er){} });   // lo guardado sin internet
  }
  if (d.dentalyColaHecha) d.dentalyColaHecha.forEach(function(id){ dbDel('cola', id); });
});

/* 📴 SIN INTERNET: se muestran las copias guardadas (solo para ver). Material sí registra: se guarda aquí
   y se manda solo al regresar la señal. */
var COLA_OK = { apiInvSalida: 1, apiInvEntrada: 1, apiInvConteo: 1, apiInvCaducidad: 1, apiInvProveedor: 1, apiInvContenido: 1 };
var OFF = false;
function horaDe(t){ var d = new Date(t); return d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2); }
function avisoOff(t){ var b = document.getElementById('offBar'); if (!b) { b = document.createElement('div'); b.id = 'offBar'; b.style.cssText = 'position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;background:#7C2D12;color:#fff;border-radius:999px;padding:9px 14px;font:700 12.5px Arial,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.3);max-width:92%;text-align:center;'; document.body.appendChild(b); } b.textContent = t; }
function corredorOff(st){
  return new Proxy({}, { get: function(o, name){
    if (name === 'withSuccessHandler') return function(f){ return corredorOff({ ok: f, mal: st.mal, uo: st.uo }); };
    if (name === 'withFailureHandler') return function(f){ return corredorOff({ ok: st.ok, mal: f, uo: st.uo }); };
    if (name === 'withUserObject') return function(u){ return corredorOff({ ok: st.ok, mal: st.mal, uo: u }); };
    if (typeof name !== 'string' || name === 'then') return undefined;
    return function(){
      var args = Array.prototype.slice.call(arguments), fn = name;
      if (COLA_OK[fn]) { dbPut('cola', null, { fn: fn, args: args, t: Date.now() }); setTimeout(function(){ if (st.ok) st.ok({ ok: true, row: 0, offline: true }, st.uo); }, 30); avisoOff('📴 Sin internet · guardado en el teléfono, se manda al regresar la señal'); return; }
      dbGet('resp', lsG(K_PIN) + '|' + fn + '|' + JSON.stringify(args), function(r){
        if (r) { if (st.ok) st.ok(r.r, st.uo); }
        else if (st.mal) st.mal(new Error('📴 Sin internet: esto se puede hacer cuando regrese la señal.'), st.uo);
      });
    };
  } });
}
function prepararOff(){
  window.google = { script: { run: corredorOff({}), history: { push: function(){}, replace: function(){}, setChangeHandler: function(){} }, url: { getLocation: function(cb){ if (cb) cb({ parameter: {}, parameters: {}, hash: '' }); } }, host: { close: function(){}, setHeight: function(){}, setWidth: function(){}, editor: { focus: function(){} } } } };
  window.appRun = function(){ return corredorOff({}); };
  window.appPrefetch = function(){};
  window.appEsInterna = function(h){ h = String(h || ''); return !!h && (h.charAt(0) === '?' || h.indexOf(SISTEMA) === 0 || /script[.]google[.]com[/](a[/][^/]+[/])?macros[/]s[/][^/?]+[/](exec|dev)/.test(h)); };
  window.appIr = function(u){
    if (typeof u === 'string' && !appEsInterna(u)) { window.open(u, '_blank'); return; }
    var p = typeof u === 'string' ? paramsDe(u.indexOf('?') === -1 ? '' : u.slice(u.indexOf('?'))) : (u || {});
    verCopia(claveDe(p), true);
  };
}
function verCopia(k, avisarSiNo){
  dbGet('snap', llaveSnap(k), function(r){
    if (!r && k.indexOf('inv:') === 0 && k !== 'inv:') { verCopia('inv:', avisarSiNo); return; }
    if (!r) { if (avisarSiNo) avisoOff('📴 Esa pantalla no está guardada en este teléfono (ábrela una vez con internet)'); else if (k !== 'agenda') verCopia('agenda', false); else verCopia('home', false); return; }
    var f = document.getElementById('marcoOff');
    if (!f) { document.body.innerHTML = ''; f = document.createElement('iframe'); f.id = 'marcoOff'; f.allow = 'camera; clipboard-read; clipboard-write'; document.body.appendChild(f); }
    f.srcdoc = r.html;
    avisoOff('📴 Sin internet · copia de las ' + horaDe(r.t) + ' · solo para ver (Material sí registra)');
  });
}
/* ⚡ VISTA PREVIA (2026-11-05): mientras Google contesta, se muestra YA la última copia de la pantalla
   (se puede leer). Los toques esperan un segundo a que el sistema esté listo; luego se quita sola. */
function vistaPrevia(k){
  dbGet('snap', llaveSnap(k), function(r){
    if (!r || SISTEMA_LISTO || document.getElementById('previa')) return;
    prepararOff();
    var f = document.createElement('iframe'); f.id = 'previa'; f.srcdoc = r.html; f.style.zIndex = '5';
    var t = document.createElement('div'); t.id = 'tapa';
    t.style.cssText = 'position:fixed;inset:0;z-index:6;background:transparent;';
    t.innerHTML = '<div id="tapaChip" style="position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#0B4F4A;color:#fff;border-radius:999px;padding:7px 13px;font:700 12.5px Arial,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25);">⏳ Conectando…</div>';
    t.onclick = function(){ var c = document.getElementById('tapaChip'); if (c) c.textContent = '⏳ Un segundo, conectando…'; };
    document.body.appendChild(f); document.body.appendChild(t);
    var c = document.getElementById('carga'); if (c) c.remove();
  });
}
function quitarPrevia(){ setTimeout(function(){ ['previa', 'tapa'].forEach(function(id){ var x = document.getElementById(id); if (x) x.remove(); }); }, 450); }

function polyfillDentaly(cfg){

  function runner(ok, mal, uo){

      if (k === 'withFailureHandler') return function(f){ return runner(ok, f, uo); };
      if (k === 'withUserObject') return function(o){ return runner(ok, mal, o); };
      if (typeof k !== 'string' || k === 'then') return undefined;
      return function(){ var a = Array.prototype.slice.call(arguments); llamar(k, a).then(function(v){ if (ok) ok(v, uo); }, function(e){ if (mal) mal(e, uo); else if (window.console) console.error(k, e); }); };
    } });

  var hist = { _h: null,
    push: function(st, p){ try { T.history.pushState({ dentalyP: p || {} }, ''); } catch(e){} },
    replace: function(st, p){ try { T.history.replaceState({ dentalyP: p || {} }, ''); } catch(e){} },

  try { T.addEventListener('popstate', function(e){ var p = e.state && e.state.dentalyP; if (p && hist._h) hist._h({ location: { parameter: p } }); }); } catch(e){}
  window.google = { script: { history: hist, url: { getLocation: function(cb){ if (cb) cb({ parameter: cfg.p0 || {}, hash: '' }); } },
    host: { close: function(){}, setHeight: function(){}, setWidth: function(){}, origin: location.origin, editor: { focus: function(){} } } } };
  Object.defineProperty(window.google.script, 'run', { get: function(){ return runner(null, null, undefined); } });

function abrirRapido(p, k, alFallar){
